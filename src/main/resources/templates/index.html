<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee List</title>
    <link rel="stylesheet" th:href="@{/css/styleIndex.css}">
</head>
<body>

<div class="sidebar">
    <h2>Kapehan Menu</h2>
    <a href="/" th:href="@{/}">Home</a>
    <a href="/add" th:href="@{/add}">Add Coffee</a>
    <a href="#">Settings</a>
</div>

<main>
    <h1>Available Coffees</h1>

    <div class="table-container">

        <!-- Search Bar -->
        <form method="get" action="/" th:action="@{/}">
            <input type="text" name="search" placeholder="Search..." th:value="${param.search}">
            <button type="submit">Search</button>
        </form>

        <!-- Coffee Table -->
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Coffee Name</th>
                <th>Type</th>
                <th>Size</th>
                <th>Price</th>
                <th>Roast Level</th>
                <th>Origin</th>
                <th>Decaffeinated</th>
                <th>Stock</th>
                <th>Flavor Notes</th>
                <th>Brew Method</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="coffee, stat : ${coffeeList}">
                <td th:text="${stat.index + 1}"></td>
                <td th:text="${coffee.name}"></td>
                <td th:text="${coffee.type}"></td>
                <td th:text="${coffee.size}"></td>
                <td th:text="'Php ' + ${coffee.price}"></td>
                <td th:text="${coffee.roastLevel}"></td>
                <td th:text="${coffee.origin}"></td>
                <td th:text="${coffee.decaf} ? 'Yes' : 'No'"></td>
                <td th:text="${coffee.stock}"></td>
                <td th:text="${#strings.listJoin(coffee.flavorNotes, ', ')}"></td>
                <td th:text="${coffee.brewMethod}"></td>
                <td class="action-links">
                    <a th:href="@{/edit(id=${coffee.id})}" class="edit-btn">Edit</a>
                    <a th:href="@{/delete(id=${coffee.id})}" class="delete-btn"
                       onclick="return confirm('Are you sure?');">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>


    </div>
</main>

</body>
</html>
