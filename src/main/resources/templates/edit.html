<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit [[${coffee.name}]]</title>
  <link rel="stylesheet" th:href="@{/css/styleEdit.css}">
</head>
<body>

<div class="sidebar">
  <h2>Kapehan Menu</h2>
  <a href="/" th:href="@{/}">Home</a>
  <a href="/add" th:href="@{/add}">Add Coffee</a>
  <a href="#">Settings</a>
</div>

<!-- Main Content -->
<div class="main-content">
  <h1 th:text="'Edit ' + ${coffee.name}"></h1>

  <form th:action="@{/update}" th:object="${coffee}" method="post">

    <input type="hidden" th:field="*{id}"/>

    <!-- Coffee Name -->
    <div id="name-area">
      <label for="name">Coffee Name:</label>
      <input type="text" id="name" th:field="*{name}"
             th:classappend="${#fields.hasErrors('name') ? ' error' : ''}">
      <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <!-- Coffee Type -->
    <div id="type-area">
      <label for="type">Type:</label>
      <select id="type" th:field="*{type}"
              th:classappend="${#fields.hasErrors('type') ? ' error' : ''}">
        <option value="Arabica" th:selected="${coffee.type == 'Arabica'}">Arabica</option>
        <option value="Robusta" th:selected="${coffee.type == 'Robusta'}">Robusta</option>
        <option value="Liberica" th:selected="${coffee.type == 'Liberica'}">Liberica</option>
        <option value="Excelsa" th:selected="${coffee.type == 'Excelsa'}">Excelsa</option>
        <option value="Bourbon" th:selected="${coffee.type == 'Bourbon'}">Bourbon</option>
        <option value="Geisha" th:selected="${coffee.type == 'Geisha'}">Geisha</option>
      </select>
      <div class="error" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
    </div>

    <!-- Size -->
    <div id="size-area">
      <label for="size">Size:</label>
      <select id="size" th:field="*{size}"
              th:classappend="${#fields.hasErrors('size') ? ' error' : ''}">
        <option value="Small">Small</option>
        <option value="Medium">Medium</option>
        <option value="Large">Large</option>
      </select>
      <div class="error" th:if="${#fields.hasErrors('size')}" th:errors="*{size}"></div>
    </div>

    <!-- Price -->
    <div id="price-area">
      <label for="price">Price:</label>
      <input type="number" id="price" th:field="*{price}" step="0.01"
             th:classappend="${#fields.hasErrors('price') ? ' error' : ''}">
      <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    </div>

    <!-- Roast Level -->
    <div id="roastLevel-area">
      <label for="roastLevel">Roast Level:</label>
      <select id="roastLevel" th:field="*{roastLevel}"
              th:classappend="${#fields.hasErrors('roastLevel') ? ' error' : ''}">
        <option value="Light" th:selected="${coffee.roastLevel == 'Light'}">Light</option>
        <option value="Medium" th:selected="${coffee.roastLevel == 'Medium'}">Medium</option>
        <option value="Dark" th:selected="${coffee.roastLevel == 'Dark'}">Dark</option>
      </select>
      <div class="error" th:if="${#fields.hasErrors('roastLevel')}" th:errors="*{roastLevel}"></div>
    </div>

    <!-- Origin -->
    <div id="origin-area">
      <label for="origin">Origin:</label>
      <input type="text" id="origin" th:field="*{origin}" maxlength="100"
             th:classappend="${#fields.hasErrors('origin') ? ' error' : ''}">
      <div class="error" th:if="${#fields.hasErrors('origin')}" th:errors="*{origin}"></div>
    </div>

    <!-- Decaf -->
    <div id="decaf-area">
      <label for="decaf">Decaffeinated:</label>
      <input type="checkbox" id="decaf" th:field="*{decaf}">
      <label for="decaf">Yes</label>
    </div>

    <!-- Stock -->
    <div id="stock-area">
      <label for="stock">Stock:</label>
      <input type="number" id="stock" th:field="*{stock}"
             th:classappend="${#fields.hasErrors('stock') ? ' error' : ''}">
      <div class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
    </div>

    <!-- Flavor Notes -->
    <div id="flavorNotes-area">
      <label>Flavor Notes:</label>
      <div>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Nutty"> Nutty</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Fruity"> Fruity</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Chocolatey"> Chocolatey</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Spicy"> Spicy</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Citrusy"> Citrusy</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Sweet"> Sweet</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Floral"> Floral</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Herbal"> Herbal</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Smoky"> Smoky</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Woody"> Woody</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Savory"> Savory</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Caramel"> Caramel</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Vanilla"> Vanilla</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Almond"> Almond</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Pineapple"> Pineapple</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Maple"> Maple</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Blackberry"> Blackberry</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Peach"> Peach</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Cinnamon"> Cinnamon</label>
        <label><input type="checkbox" th:field="*{flavorNotes}" value="Butterscotch"> Butterscotch</label>
      </div>
      <div class="error" th:if="${#fields.hasErrors('flavorNotes')}" th:errors="*{flavorNotes}"></div>
    </div>

    <!-- Brew Method -->
    <div id="brewMethod-area">
      <label for="brewMethod">Brew Method:</label>
      <select id="brewMethod" th:field="*{brewMethod}"
              th:classappend="${#fields.hasErrors('brewMethod') ? ' error' : ''}">
        <option value="Espresso" th:selected="${coffee.brewMethod == 'Espresso'}">Espresso</option>
        <option value="Drip" th:selected="${coffee.brewMethod == 'Drip'}">Drip</option>
        <option value="French Press" th:selected="${coffee.brewMethod == 'French Press'}">French Press</option>
        <option value="Pour Over" th:selected="${coffee.brewMethod == 'Pour Over'}">Pour Over</option>
        <option value="Aeropress" th:selected="${coffee.brewMethod == 'Aeropress'}">Aeropress</option>
        <option value="Cold Brew" th:selected="${coffee.brewMethod == 'Cold Brew'}">Cold Brew</option>
      </select>
      <div class="error" th:if="${#fields.hasErrors('brewMethod')}" th:errors="*{brewMethod}"></div>
    </div>

    <!-- Buttons -->
    <div id="form-buttons-area">
      <input type="submit" th:value="'Update Coffee'">
      <input type="reset" value="Reset">
    </div>

</div>
</form>

</body>
</html>
