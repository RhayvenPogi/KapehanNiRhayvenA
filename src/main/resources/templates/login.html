<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/auth.css}" />
    <title>Log In</title>
</head>
<body>
<div class="login-container">
    <h1>Login</h1>
    <form action="/login" method="POST" th:object="${user}">

        <div>
            <label for="username">User Name</label>
            <input type="text" th:field="*{username}" id="username" />
            <p class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" th:field="*{password}" id="password" />
            <p class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <p class="form-error" th:if="${error}" th:text="${error}"></p>

        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
