<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master :: html(
        title=~{::title},
        link=~{::link},
        content=~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Kapehan Catalog</title>

    <!-- Link to catalog-specific stylesheet -->
    <link rel="stylesheet" th:href="@{/css/styleCatalog.css}">
</head>
<body>
<section class="main-content">
    <!-- Page Heading -->
    <h1>Coffee Catalog</h1>

    <!-- Search form for filtering catalog items -->
    <form method="get" th:action="@{/catalog}" class="search-bar">
        <input type="text" name="search" placeholder="Search..." th:value="${param.search}">
        <button type="submit">Search</button>
    </form>

    <!-- Container for the coffee cards grid -->
    <div class="catalog-grid">
        <!-- Loop through each coffee item and render a reusable coffee card fragment -->
        <div class="coffee-card" th:each="coffee : ${coffeeList}">
            <!-- Include the coffee card fragment with current coffee data -->
            <div th:replace="~{components/coffee_card :: coffeeCardFragment(coffee=${coffee})}"></div>
        </div>
    </div>
</section>
</body>
</html>
