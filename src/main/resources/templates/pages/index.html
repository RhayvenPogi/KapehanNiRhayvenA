<!-- index.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/master :: html(
        title=~{::title},
        link=~{::link},
        content=~{::section})}">
<head>
    <!-- Page title and custom styles -->
    <title>Coffee Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/styleIndex.css}">
</head>
<body>

<!-- Main content section -->
<section class="main-content">
    <h1>Coffee List</h1>

    <!-- Search form -->
    <form method="get" th:action="@{/}" class="search-bar">
        <input type="text" name="search" placeholder="Search..." th:value="${param.search}">
        <button type="submit">Search</button>
    </form>

    <!-- Coffee list table -->
    <div class="table-container">
        <!-- Adding a wrapper div around the table for scroll -->
        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <!-- Table headers -->
                    <th>#</th>
                    <th>Coffee Name</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Price</th>
                    <th>Roast Level</th>
                    <th>Origin</th>
                    <th>Decaf</th>
                    <th>Stock</th>
                    <th>Flavor Notes</th>
                    <th>Brew Method</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <!-- Loop through coffeeList and render each coffee entry -->
                <tr th:each="coffee, stat : ${coffeeList}">
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${coffee.name}"></td>
                    <td th:text="${coffee.type}"></td>
                    <td th:text="${coffee.size}"></td>
                    <td th:text="'Php ' + ${coffee.price}"></td>
                    <td th:text="${coffee.roastLevel}"></td>
                    <td th:text="${coffee.origin}"></td>
                    <td th:text="${coffee.decaf} ? 'Yes' : 'No'"></td>
                    <td th:text="${coffee.stock}"></td>
                    <td th:text="${#strings.listJoin(coffee.flavorNotes, ', ')}"></td>
                    <td th:text="${coffee.brewMethod}"></td>

                    <!-- Action links for view, edit, and delete -->
                    <td class="action-links">
                        <a th:href="@{/coffee/{id}(id=${coffee.id})}" class="view-btn">View</a>
                        <a th:href="@{/edit(id=${coffee.id})}" class="edit-btn">Edit</a>
                        <a th:href="@{/delete(id=${coffee.id})}" class="delete-btn" onclick="return confirm('Are you sure?');">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

</body>
</html>
